<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows Folder Manager</title><link rel="stylesheet" href="/style.css"></head><body><header><div><small>LOCAL INDEX</small><h1>Windows Folder Manager</h1><p>Fast access to your Windows folders without uploading files.</p></div><nav><button id="refresh" class="ghost">Refresh</button><button id="add" class="primary">Add Folder</button></nav></header><main><section id="stats" class="stats"></section><section class="toolbar"><label class="search">⌕ <input id="q" placeholder="Search name, path, category or tag"></label><select id="cat"><option value="">All categories</option></select><button id="scan" class="ghost">Scan Folder</button></section><section id="grid" class="grid"></section><p id="empty" hidden>No folders found.</p></main><dialog id="folderDlg"><form id="folderForm"><div class="dlghead"><div><small>FOLDER RECORD</small><h2 id="dlgTitle">Add Folder</h2></div><button type="button" class="icon" data-close>×</button></div><input type="hidden" id="id"><label>Name<input id="name" required></label><label>Path<input id="path" required placeholder="D:\Projects"></label><label>Category<input id="category"></label><label>Tags<input id="tags" placeholder="video, client, archive"></label><label>Description<textarea id="description" rows="3"></textarea></label><div class="formactions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save</button></div></form></dialog><dialog id="scanDlg"><form id="scanForm"><div class="dlghead"><div><small>INDEX</small><h2>Scan a Windows folder</h2></div><button type="button" class="icon" data-close>×</button></div><label>Root path<input id="scanPath" required placeholder="D:\Projects"></label><div class="formactions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Start Scan</button></div></form></dialog><script src="/app.js"></script></body></html>
